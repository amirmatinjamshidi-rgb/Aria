[package]
name = "aria-desktop"
version = "0.1.0"
description = "Aria desktop shell"
authors = ["Aria"]
edition = "2021"

[lib]
name = "aria_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
